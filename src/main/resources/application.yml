spring:
  application:
    name: ai-agent
  profiles:
    active: local

  datasource:
    # 本机 PostgreSQL 通过 IPv6 回环地址连接；IPv6 地址在 JDBC URL 中需加方括号
    url: jdbc:postgresql://[::1]:5432/ai_agent
    username: postgres
    password: 123456

server:
  port: 8080
  servlet:
    context-path: /api

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.example.aiagent.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language:

# Mybatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml # 如果 XML文件位置自定义了方法，需要指定
  configuration:
    map-underscore-to-camel-case: false # 开启下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 显示SQL语句
  global-config:
    db-config:
      id-type: assign_id # 主键策略
      logic-delete-field: isDelete # 逻辑删除字段
      logic-delete-value: 1 # 逻辑删除值
      logic-not-delete-value: 0 # 逻辑未删除值

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug

# searchApi
search-api:
  api-key: 你的apikey